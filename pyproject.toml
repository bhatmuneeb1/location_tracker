[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-ip-location"
version = "0.2.0"
description = "Privacy-conscious offline IP geolocation with a local MaxMind database"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muneeb Amin Bhat"}]
dependencies = ["geoip2>=4.8,<6"]
keywords = ["geoip", "privacy", "networking", "incident-response"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]

[project.scripts]
ip-location = "track_location:main"

[tool.setuptools]
py-modules = ["track_location"]
